<html>
<head>
    <title>TEI Publisher Person Register</title>
    <link rel="stylesheet" href="fore.css" data-template="pages:load-fore"/>
    <script type="module" src="fore.js" data-template="pages:load-fore"/>
</head>
<body>

<fx-fore class="authority-editor">

    <fx-model id="model-1">

        <fx-instance id="default" src="api/forms/template/person-default" xpath-default-namespace="http://www.tei-c.org/ns/1.0">
        </fx-instance>

        <fx-instance id="i-template" src="api/forms/template/person-template" xpath-default-namespace="http://www.tei-c.org/ns/1.0">
            <data/>
        </fx-instance>
        <fx-bind ref="@xml:id" readonly="string-length(getRef()) != 0" />

        <fx-submission id="load" method="GET" replace="instance">
            <fx-action event="submit-done">
                <!-- setting selection we got from user as default -->
                <fx-action if="instance('default')/@xml:id = 'person-NEW'">
                    <fx-setvalue ref="instance('default')/*[1][@type='main']" value="query()"/>
                </fx-action>
            </fx-action>
        </fx-submission>
        <fx-submission id="save" method="PUT" replace="instance">
            <fx-action event="submit-done">
                <fx-message>Person saved with ID {instance('default')/@xml:id/string()}</fx-message>
                <fx-dispatch name="authority-created">
                    <fx-property name="ref" expr="instance('default')/@xml:id/string()"/>
                </fx-dispatch>
            </fx-action>
            <fx-action event="submit-error">
                <fx-message><pb-i18n key="annotations.fore.failed-save-login">Failed to save data - Please login</pb-i18n></fx-message>
            </fx-action>
        </fx-submission>

        <!-- hack til shared instances are working in Fore - accesses value of output in outer fore with stores the 'ref' -->
        <fx-function signature="getRef() as xs:string" type="text/javascript">
            const ref = document.querySelector('fx-instance#i-default').instanceData.querySelector('ref');
            return ref ? ref.innerHTML : '';
        </fx-function>

        <fx-function signature="query() as xs:string" type="text/javascript">
            const query = document.querySelector('fx-instance#i-default').instanceData.querySelector('query');
            return query ? query.innerHTML : '';
        </fx-function>
    </fx-model>

    <!--
    ### Use the header to give the main name of the page plus provide eventual buttons needed
    -->
    <header>
        <h1><pb-i18n key="annotations.person.header">Person</pb-i18n> <span class="annotations head">{instance('default')/*[1][@type='main']}</span></h1>
        <div>
            <fx-trigger>
                <paper-icon-button icon="icons:save" data-i18n="[title]annotations.save"/>
                <fx-call action="saveAction"/>
            </fx-trigger>
            <fx-trigger>
                <paper-icon-button id="close-authority" icon="close" data-i18n="[title]annotations.authority">
                    <!-- ### load the authority editor for authority type -->
                </paper-icon-button>
                <fx-confirm message="close this editor?" data-i18n="[message]annotations.fore.close-the-editor">
                    <fx-dispatch name="hide-authority" target="#document"/>
                </fx-confirm>
            </fx-trigger>
        </div>
    </header>

    <!-- ### main   -->
    <main>
        <!-- begin section general -->
        <fx-group id="general" ref="instance('default')" class="col-2">
            <h2><pb-i18n key="annotations.person.id">Person ID</pb-i18n>:
                <fx-output ref="@xml:id"/>
            </h2>

            <fx-control ref="@xml:id">
                <label><pb-i18n key="annotations.person.id">Person ID</pb-i18n></label>
                <fx-hint><pb-i18n key="annotations.person.id-hint">unique identifier</pb-i18n></fx-hint>
            </fx-control>
            <fx-group id="pers-name" ref="persName[@type='main']">
                <fieldset>
                    <legend><pb-i18n key="annotations.person.canonical-form">Canonical form</pb-i18n></legend>
                    <fx-control ref=".">
                        <fx-hint>Joachim Lelewel</fx-hint>
                    </fx-control>
                    <fx-control ref="@xml:lang">
                        <label>Jazyk</label>
                        <select class="widget">
                            <option value="la">latina</option>
                            <option value="cs">čeština</option>
                            <option value="en">angličtina</option>
                        </select>
                        <fx-hint>English</fx-hint>
                    </fx-control>
                </fieldset>
            </fx-group>
            <fx-group ref="persName[@type='sort']">
                <fieldset>
                    <legend><pb-i18n key="annotations.person.sorting-form">Sorting form</pb-i18n></legend>
                    <fx-control ref=".">
                        <fx-hint>Lelewel, Joachim</fx-hint>
                    </fx-control>
                    <fx-control ref="@xml:lang">
                        <label>Jazyk</label>
                        <select class="widget">
                            <option value="la">latina</option>
                            <option value="cs">čeština</option>
                            <option value="en">angličtina</option>
                        </select>
                        <fx-hint>English</fx-hint>
                    </fx-control>
                </fieldset>
            </fx-group>
            
             
            <fx-control ref="@sex">
                <label><pb-i18n key="annotations.person.sex">Sex</pb-i18n></label>
                <select class="widget">
                    <option value="MALE">MALE</option>
                    <option value="FEMALE">FEMALE</option>
                    <option value="UNKNOWN">UNKNOWN</option>
                </select>
                <fx-hint>MALE, FEMALE or UNKNOWN</fx-hint>
            </fx-control>
            <fx-control ref="gender/@value">
                <label><pb-i18n key="annotations.person.gender">Gender</pb-i18n></label>
                <select class="widget">
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                    <option value="U">Unknown</option>
                </select>
                <fx-hint>M, F or U</fx-hint>
            </fx-control>

        </fx-group>

        <!-- Basic name forms -->

        <fx-group id="note" ref="instance('default')" class="col-2">
            <h2><pb-i18n key="annotations.person.note">Note</pb-i18n></h2>
            <fx-control ref="note[@type='bio']" as="node" update-event="blur">
                <jinn-xml-editor unwrap="unwrap" class="widget" placeholder="[Inline text/markup or sequence of paragraphs]" schema="resources/scripts/annotations/tei.json" schema-root="note" namespace="http://www.tei-c.org/ns/1.0">
                    <div slot="toolbar">
                        <button data-command="selectElement" title="Select element around current cursor position">&lt;|&gt;</button>
                        <button data-command="encloseWith" title="Enclose selection in new element">&lt;...&gt;</button>
                        <button data-command="removeEnclosing" title="Remove enclosing tags" class="sep">&lt;X&gt;</button>
                        <button data-command="snippet" data-params="&lt;p xml:lang=&#34;cs&#34;&gt;$|_|&lt;/p&gt;" title="Insert p (cs)">&lt;p (cs)&gt;</button>
                        <button data-command="snippet" data-params="&lt;p xml:lang=&#34;en&#34;&gt;$|_|&lt;/p&gt;" title="Insert p (en)">&lt;p (en)&gt;</button>
                        <button data-command="snippet" data-params="&lt;ref target=&#34;$|1|&#34;&gt;$|_|&lt;/ref&gt;" title="Insert ref">&lt;ref&gt;</button>
                        <button data-command="snippet" data-params="&lt;hi rend=&#34;$|1|&#34;&gt;$|_|&lt;/hi&gt;" title="Insert hi">&lt;hi&gt;</button>
                        <button data-command="snippet" data-params="&lt;placeName key=&#34;$|1|&#34;&gt;$|_|&lt;/placeName&gt;" title="Insert placeName">&lt;placeName&gt;</button>
                        <button data-command="snippet" data-params="&lt;persName ref=&#34;#$|1|&#34;&gt;$|_|&lt;/persName&gt;" title="Insert persName (for EVT)">&lt;persName&gt; (EVT)</button>
                    </div>
                </jinn-xml-editor>
            </fx-control>
        </fx-group>

        <fx-group id="birth" ref="//person/birth" class="col-2">
            <h2><pb-i18n key="annotations.person.birth">Birth</pb-i18n></h2>
            <fx-control ref="date/@when">
                <label><pb-i18n key="annotations.person.date-normalized">Date normalized</pb-i18n> (YYYY-MM-DD)</label>
                <fx-hint>YYYY-MM-DD</fx-hint>
            </fx-control>
            <fx-control ref="date">
                <label><pb-i18n key="annotations.person.date-descriptive">Date descriptive</pb-i18n></label>
                <fx-hint>1786-03-22</fx-hint>
            </fx-control>
            <fx-control ref="placeName">
                <label><pb-i18n key="annotations.person.birth-place">Place of birth</pb-i18n></label>
                <fx-hint>Warsaw</fx-hint>
            </fx-control>
        </fx-group>

        <fx-group id="birth" ref="//person/death" class="col-2">
            <h2><pb-i18n key="annotations.person.death">Death</pb-i18n></h2>
            <fx-control ref="date/@when">
                <label><pb-i18n key="annotations.person.date-normalized">Date normalized</pb-i18n> (YYYY-MM-DD)</label>
                <fx-hint>YYYY-MM-DD</fx-hint>
            </fx-control>
            <fx-control ref="date">
                <label><pb-i18n key="annotations.person.date-descriptive">Date descriptive</pb-i18n></label>
                <fx-hint>1786-03-22</fx-hint>
            </fx-control>
            <fx-control ref="placeName">
                <label><pb-i18n key="annotations.person.death-place">Place of death</pb-i18n></label>
                <fx-hint>Warsaw</fx-hint>
            </fx-control>
        </fx-group>


        <!-- // end section general -->
        <!-- begin section name variants -->
        <fx-group>
            <header>
                <pb-i18n key="annotations.person.name-variants">Name variants</pb-i18n> ({count(//persName[@type='variant'])})
                <fx-trigger class="add-button">
                    <!--                        <button>add</button>-->
                    <paper-icon-button icon="icons:add" data-i18n="[title]annotations.add.authority"/>
                    <fx-insert context="//person" ref="persName" origin="instance('i-template')//persName[@type='variant']"/>
                </fx-trigger>
            </header>

            <fx-repeat id="r-nameVariant" ref="//persName[@type='variant']" class="two-col">
                <template>
                    <fieldset>
                        <legend><pb-i18n key="annotations.person.variant-form">Variant form</pb-i18n></legend>
                        <fx-control ref=".">
                            <fx-hint>Lelewel, Joachim</fx-hint>
                        </fx-control>
                        <fx-control ref="@xml:lang">
                            <label>Jazyk</label>
                            <select class="widget">
                                <option value="la">latina</option>
                                <option value="cs">čeština</option>
                                <option value="en">angličtina</option>
                            </select>
                            <fx-hint>English</fx-hint>
                        </fx-control>
                        <fx-trigger>
                            <paper-icon-button icon="close" data-i18n="[title]annotations.authority" title="delete"/>
                            <fx-delete ref="."/>
                        </fx-trigger>
                    </fieldset>
                </template>
            </fx-repeat>
        </fx-group>

        <!-- begin section professions -->
        <fx-group>
            <header>
                <pb-i18n key="annotations.person.professions-and-roles">Professions and roles</pb-i18n>
                 ({count(//occupation)})
                <fx-trigger class="add-button">
                    <paper-icon-button icon="icons:add" data-i18n="[title]annotations.add.roles"/>
                    <fx-insert context="//person" ref="name" origin="instance('i-template')//occupation"/>
                </fx-trigger>
            </header>

            <fx-repeat id="r-occupation" ref="//occupation" class="two-col">
                <template>
                    <fx-control ref=".">
                        <label><pb-i18n key="annotations.person.profession">Profession</pb-i18n></label>
                        <fx-hint>teacher</fx-hint>
                    </fx-control>
                    <fx-trigger>
                        <paper-icon-button icon="close" data-i18n="[title]annotations.authority" title="delete"/>
                        <fx-delete ref="."/>
                    </fx-trigger>
                </template>
            </fx-repeat>
        </fx-group>

        <!-- begin section references -->
        <fx-group>
            <header>
                <pb-i18n key="annotations.references.header">References</pb-i18n> ({count(//idno)})
                <fx-trigger class="add-button">
                    <paper-icon-button icon="icons:add" data-i18n="[title]annotations.add.references"/>
                    <fx-insert context="//person" ref="idno" origin="instance('i-template')//idno"/>
                </fx-trigger>
            </header>

            <fx-repeat id="r-occupation" ref="//idno" class="two-col">
                <template>
                    <fx-control ref="@type">
                        <label><pb-i18n key="annotations.references.source">Source</pb-i18n></label>
                        <select class="widget">
                            <option value="GND">GND</option>
                            <option value="WIKI">Wikidata</option>
                            <option value="BBDR">BBDR</option>
                            <option value="GEO">GeoNames</option>
                            <option value="TNL">Theatrum Neolatinum</option>
                        </select>
                        <fx-hint>Wikidata</fx-hint>
                    </fx-control>
                    <legend><pb-i18n key="annotations.person.url">URL</pb-i18n></legend>
                    <fx-control ref=".">
                        <fx-hint>https://d-nb.info/gnd/4079167-1</fx-hint>
                    </fx-control>
                    <fx-trigger>
                        <paper-icon-button icon="close" data-i18n="[title]annotations.authority" title="delete"/>
                        <fx-delete ref="."/>
                    </fx-trigger>
                </template>
            </fx-repeat>
        </fx-group>
    </main>
    <fx-trigger>
        <paper-icon-button icon="icons:save" data-i18n="[title]annotations.save"/>
        <fx-call action="saveAction"/>
    </fx-trigger>

    <fx-action event="ready" if="string-length(getRef()) = 0">
        <fx-send event="ready" submission="load" url="api/register/NEW"/>
    </fx-action>
    <fx-action event="ready" if="string-length(getRef()) != 0">
        <fx-send event="ready" submission="load" url="api/register/{getRef()}"/>
    </fx-action>

    <fx-action id="saveAction">
        <fx-action if="string-length(getRef()) != 0">
            <fx-send submission="save" url="api/register/{getRef()}"/>
        </fx-action>
        <fx-action if="string-length(getRef()) = 0">
            <fx-send submission="save" url="api/register/person-NEW"/>
        </fx-action>
    </fx-action>
</fx-fore>

</body>
</html>
