<html>
<head>
    <title>TEI Publisher Place Register</title>
    <link rel="stylesheet" href="fore.css" data-template="pages:load-fore"/>
    <script type="module" src="fore.js" data-template="pages:load-fore"/>
</head>
<body>

<fx-fore class="authority-editor" ignore-expressions="pb-leaflet-map">

    <fx-model id="model-1">

        <fx-instance id="default" src="api/forms/template/place-default" xpath-default-namespace="http://www.tei-c.org/ns/1.0">
        </fx-instance>

        <fx-instance id="i-template" src="api/forms/template/place-template" xpath-default-namespace="http://www.tei-c.org/ns/1.0">
            <data/>
        </fx-instance>

        <fx-instance id="place-types" src="api/forms/template/place-types" xpath-default-namespace="http://www.tei-c.org/ns/1.0">
            <data/>
        </fx-instance>
        <fx-bind ref="@xml:id" readonly="string-length(getRef()) != 0" />

        <fx-submission id="load" method="GET" replace="instance">
            <fx-action event="submit-done">
                <!-- setting selection we got from user as default -->
                <fx-action if="instance()/@xml:id = 'place-NEW'">
                    <fx-setvalue ref="instance()/*[1][@type='main']" value="query()"/>
                </fx-action>
            </fx-action>
        </fx-submission>
        <fx-submission id="save" method="PUT" replace="instance">
                <fx-action event="submit-done">
                <fx-message>Place saved with ID {instance()/@xml:id/string()}</fx-message>
                    <fx-dispatch name="authority-created">
                    <fx-property name="ref" expr="instance()/@xml:id/string()"/>
                    </fx-dispatch>
                </fx-action>
            <fx-action event="submit-error">
                <fx-message><pb-i18n key="annotations.fore.failed-save-login">Failed to save data - Please login</pb-i18n></fx-message>
            </fx-action>
        </fx-submission>

        <!-- hack til shared instances are working in Fore - accesses value of output in outer fore with stores the 'ref' -->
        <fx-function signature="getRef() as xs:string" type="text/javascript">
            return document.querySelector('fx-instance#i-default').instanceData.querySelector('ref').innerHTML;
        </fx-function>

        <fx-function signature="query() as xs:string" type="text/javascript">
            return document.querySelector('fx-instance#i-default').instanceData.querySelector('query').innerHTML;
        </fx-function>
    </fx-model>

    <!--
    ### Use the header to give the main name of the page plus provide eventual buttons needed
    -->
    <header>
        <h1><pb-i18n key="annotations.place.header">Place</pb-i18n> <span class="annotations head">{instance('default')/*[1][@type='main']}</span></h1>
        <div>
            <fx-trigger>
                <paper-icon-button icon="icons:save" data-i18n="[title]annotations.save"/>
                <fx-call action="saveAction"/>
            </fx-trigger>
            <fx-trigger>
                <paper-icon-button id="close-authority" icon="close" data-i18n="[title]annotations.authority">
                    <!-- ### load the authority editor for authority type -->
                </paper-icon-button>
                <fx-confirm message="close this editor?" data-i18n="[message]annotations.fore.close-the-editor">
                    <fx-dispatch name="hide-authority" target="#document"/>
                </fx-confirm>
            </fx-trigger>
        </div>
    </header>


    <!-- ### main   -->
    <main>
        <!-- begin section general -->
        <fx-group id="general" ref="instance()" class="col-2">
            <h2><pb-i18n key="annotations.place.id">Place ID</pb-i18n>:
                <fx-output ref="@xml:id"/>
            </h2>
            <fx-control ref="@xml:id">
                <label><pb-i18n key="annotations.place.id">Place ID</pb-i18n></label>
                <fx-hint><pb-i18n key="annotations.place.id-hint">unique identifier</pb-i18n></fx-hint>
            </fx-control>
            <fx-control ref="placeName[@type='main']">
                <label><pb-i18n key="annotations.place.canonical-form">Canonical form</pb-i18n></label>
                <fx-hint>Kraków</fx-hint>
            </fx-control>
            <fx-control ref="placeName[@type='sort']">
                <label><pb-i18n key="annotations.place.sorting-form">Sorting form</pb-i18n></label>
                <fx-hint>Krakow</fx-hint>
            </fx-control>
            <fx-control ref="@type">
                <label><pb-i18n key="annotations.place.type">Type</pb-i18n></label>
                <select class="widget" ref="instance('place-types')/category">
                    <template>
                        <option value="{@xml:id}">{catDesc}</option>
                    </template>
                </select>
            </fx-control>
        </fx-group>

        <fx-group id="note" ref="instance()" class="col-2">
            <h2><pb-i18n key="annotations.place.note">Note</pb-i18n></h2>
            <fx-control ref="note" as="node" update-event="blur">
                <jinn-xml-editor unwrap="unwrap" class="widget" placeholder="[Inline text/markup or sequence of paragraphs]" schema="resources/scripts/annotations/tei.json" schema-root="note" namespace="http://www.tei-c.org/ns/1.0">
                    <div slot="toolbar">
                        <button data-command="selectElement" title="Select element around current cursor position">&lt;|&gt;</button>
                        <button data-command="encloseWith" title="Enclose selection in new element">&lt;...&gt;</button>
                        <button data-command="removeEnclosing" title="Remove enclosing tags" class="sep">&lt;X&gt;</button>
                        <button data-command="snippet" data-params="&lt;p xml:lang=&#34;cs&#34;&gt;$|_|&lt;/p&gt;" title="Insert p (cs)">&lt;p (cs)&gt;</button>
                        <button data-command="snippet" data-params="&lt;p xml:lang=&#34;en&#34;&gt;$|_|&lt;/p&gt;" title="Insert p (en)">&lt;p (en)&gt;</button>
                        <button data-command="snippet" data-params="&lt;placeName key=&#34;$|1|&#34;&gt;$|_|&lt;/placeName&gt;" title="Insert placeName">&lt;placeName&gt;</button>
                        <button data-command="snippet" data-params="&lt;persName key=&#34;$|1|&#34;&gt;$|_|&lt;/persName&gt;" title="Insert persName">&lt;persName&gt;</button>
                    </div>
                </jinn-xml-editor>
            </fx-control>
        </fx-group>

        <!-- // end section general -->

        <!-- begin section name variants -->
        <fx-group>
            <header><pb-i18n key="annotations.place.name-variants">Name variants</pb-i18n> ({count(//placeName[@type='variant'])})
                <fx-trigger class="add-button">
                    <paper-icon-button icon="icons:add" data-i18n="[title]annotations.add.roles"/>
                    <fx-insert context="//place" ref="placeName" origin="instance('i-template')//placeName[@type='variant']"/>
                </fx-trigger>
            </header>
            <fx-repeat id="r-nameVariant" ref="//placeName[@type='variant']" class="two-col">
                <template>
                    <fx-control ref=".">
                        <label><pb-i18n key="annotations.place.name">Name</pb-i18n></label>
                        <fx-hint>Cracow</fx-hint>
                    </fx-control>
                    <fx-trigger>
                        <paper-icon-button icon="close" data-i18n="[title]annotations.authority" title="delete"/>
                        <fx-delete ref="."/>
                    </fx-trigger>
                </template>
            </fx-repeat>
        </fx-group>
        <!-- // end section name variants -->
        <fx-group>
            <header><pb-i18n key="annotations.place.location">Location</pb-i18n></header>
            <fx-control ref="//location/geo" update-event="change">
                <label><pb-i18n key="annotations.place.latitude-and-longitude">Latitude and longitude</pb-i18n></label>
                <fx-hint/>
                <fx-action event="value-changed">
                    <fx-dispatch name="geolocation" targetid="authority-editor">
                        <fx-property name="coordinates" expr="string(.)"/>
                    </fx-dispatch>
                </fx-action>
            </fx-control>
            <fx-control ref="//country">
                <label><pb-i18n key="annotations.place.country">Country</pb-i18n></label>
                <fx-hint>Cracow</fx-hint>
            </fx-control>
            <fx-control ref="//region">
                <label><pb-i18n key="annotations.place.region">Region</pb-i18n></label>
                <fx-hint>małopolska</fx-hint>
            </fx-control>
            <div><pb-i18n key="annotations.place.location-hint">Search for location or click while holding ctrl or cmd key to mark coordinates</pb-i18n></div>
            <pb-leaflet-map id="map" zoom="11" fit-markers="" geo-coding="">
                <pb-map-layer show="" base="" label="Mapbox" url="https://{s}.tile.osm.org/{z}/{x}/{y}.png" max-zoom="19" attribution="© &lt;a href=&#34;https://osm.org/copyright&#34;&gt;OpenStreetMap&lt;/a&gt; contributors"/>
            </pb-leaflet-map>
        </fx-group>

        <!-- begin section references -->
        <fx-group>
            <header>
                <pb-i18n key="annotations.references.header">References</pb-i18n> ({count(//idno)})
                <fx-trigger class="add-button">
                    <paper-icon-button icon="icons:add" data-i18n="[title]annotations.add.references"/>
                    <fx-insert context="//place" ref="idno" origin="instance('i-template')//idno"/>
                </fx-trigger>
            </header>

            <fx-repeat id="r-occupation" ref="//idno" class="two-col">
                <template>
                    <fx-control ref="@type">
                        <label><pb-i18n key="annotations.references.source">Zdroj</pb-i18n></label>
                        <select class="widget">
                            <option value="GND">GND</option>
                            <option value="WIKI">Wikidata</option>
                            <option value="BBDR">BBDR</option>
                        </select>
                        <fx-hint>Wikidata</fx-hint>
                    </fx-control>
                    <legend><pb-i18n key="annotations.person.url">URL</pb-i18n></legend>
                    <fx-control ref=".">
                        <fx-hint>https://d-nb.info/gnd/4079167-1</fx-hint>
                    </fx-control>
                    <fx-trigger>
                        <paper-icon-button icon="close" data-i18n="[title]annotations.authority" title="delete"/>
                        <fx-delete ref="."/>
                    </fx-trigger>
                </template>
            </fx-repeat>
        </fx-group>
    </main>
    <fx-trigger>
        <paper-icon-button icon="icons:save" data-i18n="[title]annotations.save"/>
        <fx-call action="saveAction"/>
    </fx-trigger>

    <fx-action event="ready" if="string-length(getRef()) = 0">
        <fx-send event="ready" submission="load" url="api/register/place-NEW"/>
    </fx-action>
    <fx-action event="ready" if="string-length(getRef()) != 0">
        <fx-send event="ready" submission="load" url="api/register/{getRef()}"/>
    </fx-action>

    <fx-action id="saveAction">
        <fx-action if="string-length(getRef()) != 0">
            <fx-send submission="save" url="api/register/{getRef()}"/>
        </fx-action>
        <fx-action if="string-length(getRef()) = 0">
            <fx-send submission="save" url="api/register"/>
        </fx-action>
    </fx-action>

    <fx-action event="pb-geocode">
        <fx-message value="event('name')"/>
        <fx-setvalue ref="instance()//location/geo" value="event('coordinates')?latitude || ' ' || event('coordinates')?longitude"/>
        <fx-setvalue ref="instance()//country" value="event('properties')?address?country"/>
        <fx-setvalue ref="instance()//region" value="event('properties')?address?state"/>
    </fx-action>
</fx-fore>

</body>
</html>
